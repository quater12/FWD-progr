[project]
name = "fastapi-project"
version = "0.1.0"
description = "college"
authors = [
    {name = "Boryslaw Humenuik ",email = "boryshumm@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pyjwt (>=2.12.1,<3.0.0)",
    "fastapi (>=0.115.0,<0.136.0)",
    "uvicorn[standard] (>=0.30.0,<0.45.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.28.0,<1.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
    "email-validator (>=2.0.0,<3.0.0)",
    "bcrypt (>=4.0.0,<5.0.0)",
    "prometheus-client (>=0.20.0,<1.0.0)",
    "prometheus-fastapi-instrumentator (>=7.0.0,<8.0.0)",
    "pytest (>=8.3.0,<9.0.0)",
    "pytest-asyncio (>=0.24.0,<0.27.0)",
    "httpx (>=0.27.0,<1.0.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

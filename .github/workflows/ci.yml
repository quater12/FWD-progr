name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/fastapi_test
        run: poetry run alembic upgrade head

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/fastapi_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/fastapi_test
        run: poetry run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fastapi-app:test .
